server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # uploads are 128x128 after resizing, but the raw file can be larger
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Single origin for the browser: the API is proxied to the backend service.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback so deep links (/soft-moe, /face-to-sketch, ...) work on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
